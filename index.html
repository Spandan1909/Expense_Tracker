<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header class="app-header">
      <h1>💰 Expense Tracker</h1>
      <p class="subtitle">Keep track of where your money goes</p>
    </header>

    <!-- Summary cards -->
    <section class="summary">
      <div class="card summary-card">
        <span class="summary-label">Total Spent</span>
        <span class="summary-value" id="totalAmount">₹0</span>
      </div>
      <div class="card summary-card">
        <span class="summary-label">Transactions</span>
        <span class="summary-value" id="totalCount">0</span>
      </div>
    </section>

    <!-- Add expense form -->
    <section class="card form-card">
      <h2>Add Expense</h2>
      <form id="expenseForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="expenseName">Expense Name</label>
            <input type="text" id="expenseName" placeholder="e.g. Groceries" autocomplete="off">
            <span class="error-message" id="nameError"></span>
          </div>

          <div class="form-group">
            <label for="expenseAmount">Amount (₹)</label>
            <input type="number" id="expenseAmount" placeholder="e.g. 500" min="0" step="0.01">
            <span class="error-message" id="amountError"></span>
          </div>

          <div class="form-group">
            <label for="expenseCategory">Category</label>
            <select id="expenseCategory">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary">Add Expense</button>
      </form>
    </section>

    <!-- Expense list -->
    <section class="card list-card">
      <div class="list-header">
        <h2>Your Expenses</h2>
        <div class="filter-group">
          <label for="categoryFilter">Filter:</label>
          <select id="categoryFilter">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <ul id="expenseList" class="expense-list">
        <!-- Expense items are rendered here by JavaScript -->
      </ul>

      <p id="emptyMessage" class="empty-message">No expenses yet. Add one above to get started!</p>
    </section>

    <footer class="app-footer">
      <p>Built with HTML, CSS &amp; JavaScript</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
